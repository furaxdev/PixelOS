name: Lint & validate

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck pixelos-cli
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tools'

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2-utils
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: xmllint local_manifests
        run: |
          for f in manifests/local_manifests/*.xml; do
            echo "checking $f"
            xmllint --noout "$f"
          done

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'
        continue-on-error: true

  html-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic HTML validation
        run: |
          for f in site/*.html; do
            echo "checking $f"
            python3 -c "
import sys
from html.parser import HTMLParser
class P(HTMLParser):
    def error(self, message): sys.exit('parse error: ' + message)
P().feed(open('$f').read())
print('ok')
"
          done
