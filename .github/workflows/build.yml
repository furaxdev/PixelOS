name: Build (manual, self-hosted only)

# Building AOSP/LineageOS needs ~250GB disk, 16GB+ RAM, and hours of CPU time — GitHub-hosted runners
# (14GB disk) cannot do this. This workflow only runs on a self-hosted runner you register yourself:
# Settings -> Actions -> Runners -> "New self-hosted runner", tagged `pixelos-builder`.
# It is manual-dispatch only, it never runs automatically on push.

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Device codename (e.g. matissewifi, pixelos_x86_64)'
        required: true
        default: 'pixelos_x86_64'
      variant:
        description: 'Build variant'
        required: true
        default: 'userdebug'
        type: choice
        options: [eng, userdebug, user]

jobs:
  build:
    runs-on: [self-hosted, pixelos-builder]
    steps:
      - uses: actions/checkout@v4
      - name: doctor
        run: tools/pixelos-cli/pixelos doctor
      - name: sync
        run: tools/pixelos-cli/pixelos sync
      - name: device
        run: tools/pixelos-cli/pixelos device "${{ inputs.codename }}"
      - name: build
        run: tools/pixelos-cli/pixelos build "${{ inputs.codename }}" "${{ inputs.variant }}"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelos-${{ inputs.codename }}-${{ inputs.variant }}
          path: ~/pixelos-src/out/target/product/${{ inputs.codename }}/*.zip
          retention-days: 14
